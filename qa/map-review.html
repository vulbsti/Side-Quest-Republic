<!doctype html><meta charset="utf-8"><base href="/dist/"><title>Service Gali route review</title><style>body{margin:0;font:14px system-ui}nav{position:fixed;top:12px;left:12px;z-index:10}button{padding:14px;background:#e9eccb;border:0;margin:4px;border-radius:6px}#status{position:fixed;bottom:12px;left:12px;background:#142f27;color:white;padding:12px;z-index:10}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three.module.js"}}</script><nav><button id="gali">Service Gali</button><button id="market">Market fronts</button><button id="advance">Advance buses 20 seconds</button></nav><div id="scene"></div><div id="status">Loading the actual map…</div><script type="module">
import * as T from 'three';import {buildWorld} from '../dist/world.js?v=15';import {expandWorld} from '../dist/world-expansion.js?v=15';import {enhanceEnvironment} from '../dist/environment-detail.js?v=15';import {loadCharacters} from '../dist/characters.js?v=15';import {TransitClient} from '../dist/transit-client.js?v=15';
const world=await buildWorld(document.getElementById('scene'));await enhanceEnvironment(T,world);const expansion=expandWorld(world);await loadCharacters();const transit=new TransitClient({world});let time=0;function camera(name){if(name==='gali'){world.camera.position.set(-44,10,84);world.camera.lookAt(-58,1,63);}else{world.camera.position.set(-51,6,73);world.camera.lookAt(-56,1.6,84);}}document.getElementById('gali').onclick=()=>camera('gali');document.getElementById('market').onclick=()=>camera('market');document.getElementById('advance').onclick=()=>{for(let i=0;i<1200;i++){transit.tick(1/60);time+=1/60;}};camera('gali');let last=0;function frame(t){requestAnimationFrame(frame);const dt=last?Math.min(.05,(t-last)/1000):0;last=t;time+=dt;transit.tick(dt);world.renderer.render(world.scene,world.camera);const b=transit.state.buses[1];document.getElementById('status').textContent=`Actual map scenery · west shuttle (${b.x.toFixed(1)}, ${b.z.toFixed(1)}) · ${b.status} · ${b.obstructed?'BLOCKED: '+b.blockedReason:'route clear'} · ${time.toFixed(1)} s`; }requestAnimationFrame(frame);
</script>
