<!doctype html><meta charset="utf-8"><title>Shuttle and character review</title><style>body{margin:0;background:#26302c;font:15px system-ui;color:white}nav{position:fixed;top:15px;left:15px;display:flex;gap:8px;z-index:2}button,select{padding:12px;background:#e8e8ce;border:0;border-radius:6px}#status{position:fixed;bottom:12px;left:12px;background:#162c25;padding:12px}</style>
<script type="importmap">{"imports":{"three":"../dist/vendor/three.module.js"}}</script>
<nav><button id="front">Front / side</button><button id="rear">Rear / side</button><button id="cabin">Cabin</button><button id="asha">Asha gesture</button><select id="gesture"><option>shrug</option><option>phone</option><option>wave</option><option>point</option><option>rest</option></select></nav><div id="status">Loading actual game assets…</div>
<script type="module">
import * as T from 'three';import {buildShuttleModel} from '../dist/shuttle-model.js?v=15';import {loadCharacters,makeCharacter,animateCharacter} from '../dist/characters.js?v=15';import {createTransit} from '../dist/transit.js?v=15';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.toneMapping=T.ACESFilmicToneMapping;document.body.append(r.domElement);const s=new T.Scene();s.background=new T.Color('#b4c2bd');s.add(new T.HemisphereLight('#eef3ef','#73634f',2));const sun=new T.DirectionalLight('#ffeed3',3);sun.position.set(9,15,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;s.add(sun);const ground=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:'#888b7d',roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;s.add(ground);const camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.05,120),b=createTransit().buses[0],model=buildShuttleModel(b);s.add(model.g);await loadCharacters();const person=makeCharacter({gender:'female',color:'#628472'});person.position.set(3.2,0,1);s.add(person);let view='front',seconds=0,last=0;function set(v){view=v;model.shells.forEach(o=>o.visible=true);model.door.visible=v!=='cabin';if(v==='front'){camera.position.set(10,5.5,12);camera.lookAt(0,1.2,0);}if(v==='rear'){camera.position.set(-10,4,-12);camera.lookAt(0,1.4,0);}if(v==='cabin'){camera.position.set(0,2.65,-3.8);camera.lookAt(0,1.5,3.5);}if(v==='asha'){camera.position.set(3.2,1.6,4.4);camera.lookAt(3.2,1.05,1);}}for(const id of ['front','rear','cabin','asha'])document.getElementById(id).onclick=()=>set(id);set('front');function frame(t){requestAnimationFrame(frame);const dt=last?Math.min(.25,(t-last)/1000):0;last=t;seconds+=dt;animateCharacter(person,0,seconds,{gesture:document.getElementById('gesture').value,talking:true,important:true});r.render(s,camera);document.getElementById('status').textContent=`Actual shipped rig · ${document.getElementById('gesture').value} · ${seconds.toFixed(1)} seconds · ${r.info.render.calls} draw calls`; }requestAnimationFrame(frame);
</script>
